<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelSnap - Editor Totale</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0f172a;
            --bg-card: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --success-hover: #059669;
            --purple: #8b5cf6;
            --purple-hover: #7c3aed;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
        }

        header {
            width: 100%;
            padding: 20px 0;
            text-align: center;
            border-bottom: 1px solid var(--border);
            background: var(--bg-card);
        }

        header h1 {
            margin: 0;
            font-size: 1.6rem;
            color: var(--primary);
        }

        header p {
            margin: 5px 0 0;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
        }

        /* --- STILE SPAZI PUBBLICITARI --- */
        .ad-slot {
            background: var(--bg-card);
            border: 1px dashed var(--border);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .drop-zone {
            background: var(--bg-card);
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .drop-zone:hover {
            border-color: var(--primary);
        }

        .drop-zone p {
            margin: 10px 0 0;
            color: var(--text-muted);
        }

        #fileInput {
            display: none;
        }

        .editor-panel {
            display: none;
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border);
        }

        .container-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 8px;
        }

        .btn-crop-toggle {
            background: #334155;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .btn-crop-toggle.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .img-container {
            width: 100%;
            height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: repeating-conic-gradient(#334155 0% 25%, #1e293b 0% 50%);
            background-size: 16px 16px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        /* NASCONDIAMO L'IMMAGINE VUOTA PER EVITARE SCRITTE E DISALLINEAMENTI */
        #imageToCrop {
            display: none;
            max-width: 100%;
            max-height: 100%;
        }

        #previewCanvas {
            display: none;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            cursor: crosshair;
        }

        #brushSizeGroup {
            display: none;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 15px;
        }

        #brushSizeGroup.active {
            display: block;
        }

        #brushSizeGroup label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
